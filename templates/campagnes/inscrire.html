{% extends 'base.html' %}
{% block title %}S'inscrire à la campagne{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-1"><i class="bi bi-calendar-check text-primary"></i> S'inscrire</h4>
      <p class="text-muted mb-4">{{ campagne.nom }} — {{ campagne.date }}</p>
      <form method="post">
        {% csrf_token %}
        {% for field in form %}
          <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            <input type="{{ field.field.widget.input_type }}"
                   name="{{ field.html_name }}"
                   class="form-control {% if field.errors %}is-invalid{% endif %}"
                   value="{{ field.value|default:'' }}">
            {% for error in field.errors %}
              <div class="invalid-feedback">{{ error }}</div>
            {% endfor %}
          </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary w-100">Confirmer l'inscription</button>
        <a href="{% url 'detail_campagne' campagne.pk %}" class="btn btn-outline-secondary w-100 mt-2">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
