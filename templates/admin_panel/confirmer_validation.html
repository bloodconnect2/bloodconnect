{% extends 'base.html' %}
{% block title %}Valider l'hôpital{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <i class="bi bi-check-circle-fill text-success" style="font-size:3rem"></i>
      <h4 class="mt-3">Valider cet hôpital ?</h4>
      <p class="text-muted"><strong>{{ hopital.nom }}</strong> — {{ hopital.ville }}</p>
      <p class="small text-muted">Agrément : {{ hopital.numero_agrement }}</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-success me-2">Confirmer la validation</button>
        <a href="{% url 'liste_hopitaux' %}" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
