{% extends 'base.html' %}
{% block title %}Clôturer la demande{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <i class="bi bi-x-circle-fill text-danger" style="font-size:3rem"></i>
      <h4 class="mt-3">Clôturer cette demande ?</h4>
      <p class="text-muted">Groupe : <strong>{{ demande.groupe_sanguin }}</strong> — {{ demande.quantite }} poche(s)</p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2">Confirmer</button>
        <a href="{% url 'dashboard_hopital' %}" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
