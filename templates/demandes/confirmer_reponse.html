{% extends 'base.html' %}
{% block title %}Confirmer ma réponse{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4 text-center">
      <i class="bi bi-heart-fill text-danger" style="font-size:3rem"></i>
      <h4 class="mt-3">Confirmer votre intention de don ?</h4>
      <p class="text-muted">
        Groupe requis : <strong>{{ demande.groupe_sanguin }}</strong><br>
        Hôpital : <strong>{{ demande.hopital.nom }}</strong><br>
        Avant le : <strong>{{ demande.delai }}</strong>
      </p>
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger me-2"><i class="bi bi-check-circle"></i> Confirmer</button>
        <a href="{% url 'detail_demande' demande.pk %}" class="btn btn-outline-secondary">Annuler</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
