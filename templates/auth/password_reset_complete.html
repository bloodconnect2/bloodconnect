{% extends 'base.html' %}
{% block title %}Mot de passe réinitialisé{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center">
    <div class="card p-5">
      <i class="bi bi-check-circle-fill text-success" style="font-size:4rem"></i>
      <h4 class="mt-3">Mot de passe réinitialisé !</h4>
      <p class="text-muted">Connectez-vous avec votre nouveau mot de passe.</p>
      <a href="{% url 'login' %}" class="btn btn-danger mt-2">Se connecter</a>
    </div>
  </div>
</div>
{% endblock %}
