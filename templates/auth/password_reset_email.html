<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"></head>
<body style="font-family: Arial, sans-serif; background:#f8f9fa; padding:20px;">
  <div style="max-width:500px; margin:auto; background:white; border-radius:12px; padding:30px; border-top: 4px solid #dc3545;">
    <h2 style="color:#dc3545;">🩸 BloodConnect</h2>
    <p>Bonjour <strong>{{ user.get_full_name }}</strong>,</p>
    <p>Vous avez demandé la réinitialisation de votre mot de passe.</p>
    <div style="text-align:center; margin: 30px 0;">
      <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
         style="background:#dc3545; color:white; padding:14px 28px; border-radius:8px; text-decoration:none; font-weight:bold;">
        Réinitialiser mon mot de passe
      </a>
    </div>
    <p style="color:#666; font-size:13px;">Ce lien est valide pendant <strong>24 heures</strong>.</p>
    <p style="color:#666; font-size:13px;">Si vous n'avez pas demandé cette réinitialisation, ignorez cet email.</p>
    <hr style="border:none; border-top:1px solid #eee; margin:20px 0;">
    <p style="color:#999; font-size:12px; text-align:center;">BloodConnect — Plateforme de don de sang</p>
  </div>
</body>
</html>
