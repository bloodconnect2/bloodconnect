{% extends 'base.html' %}
{% block title %}Mot de passe oublié{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h4 class="mb-3 text-center"><i class="bi bi-key text-danger"></i> Mot de passe oublié ?</h4>
      <p class="text-muted text-center">Entrez votre email pour recevoir un lien de réinitialisation.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Adresse email</label>
          <input type="email" name="email" class="form-control" placeholder="exemple@email.com" required>
        </div>
        <button type="submit" class="btn btn-danger w-100">
          <i class="bi bi-envelope"></i> Envoyer le lien
        </button>
      </form>
      <hr>
      <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100">
        <i class="bi bi-arrow-left"></i> Retour au login
      </a>
    </div>
  </div>
</div>
{% endblock %}
